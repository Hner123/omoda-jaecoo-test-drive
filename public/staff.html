<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OMODA & JAECOO Queue — Staff</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="staff">
  <header class="topbar">
    <a class="brand" href="/staff"><span class="logo" role="img" aria-label="OMODA &amp; JAECOO"></span> <small>Staff Console</small></a>
    <nav><a href="/">Kiosk</a><a href="/staff" class="active">Staff</a><a href="/analytics">Analytics</a><a href="/display" target="_blank">Lobby display</a><a href="/qr" target="_blank">QR poster</a><a href="#" id="logout" hidden>Sign out</a></nav>
  </header>

  <main class="wrap" id="login" style="max-width:420px">
    <p class="eyebrow">Staff only</p>
    <h1>Sign in</h1>
    <form class="panel" id="login-form">
      <label for="pin">Staff PIN</label>
      <input id="pin" type="password" inputmode="numeric" autofocus />
      <div class="error" id="login-err"></div>
      <button class="btn block" type="submit">Continue</button>
    </form>
  </main>

  <main class="wrap" id="console" hidden style="max-width:1880px">
    <div class="q-head">
      <div><p class="eyebrow" id="date"></p><h1>Test drive queue</h1></div>
      <div class="q-kpis" id="summary"></div>
    </div>
    <div class="q-tools">
      <input class="q-search" id="queue-search" type="search" placeholder="Find a guest by name, number or mobile" aria-label="Find a guest by name, number or mobile" autocomplete="off" />
      <div class="q-chips" id="q-filters"></div>
      <button type="button" class="q-announce" id="announce" aria-pressed="false" title="Play call announcements on this device. Leave off when the lobby display is nearby."><span class="q-tog" aria-hidden="true"></span>Announce here</button>
    </div>
    <div class="q-lanes" id="cols"></div>
    <section class="panel" style="margin-top:20px">
      <div class="guest-head">
        <div>
          <h2 style="margin:0 0 4px">Daily report</h2>
          <div class="muted" style="font-size:14px">Download registrations as CSV, or Excel with a summary sheet.</div>
        </div>
        <div class="guest-actions">
          <select id="report-day" aria-label="Report day"></select>
          <button type="button" class="btn sm" id="report-download">Download Excel</button>
          <button type="button" class="btn ghost sm" id="report-csv">Download CSV</button>
        </div>
      </div>
      <div class="guest-result" id="report-result" hidden></div>
    </section>
    <section class="panel" style="margin-top:20px">
      <div class="guest-head">
        <div>
          <h2 style="margin:0 0 4px">Dealer guest list</h2>
          <div class="muted" style="font-size:14px" id="guest-summary"></div>
        </div>
        <div class="guest-actions">
          <button type="button" class="btn ghost sm" id="guest-template">Download template</button>
          <button type="button" class="btn sm" id="guest-upload">Upload list</button>
          <input type="file" id="guest-file" accept=".csv,.xlsx,.xls" hidden />
          <button type="button" class="btn danger sm" id="guest-clear" hidden>Clear list</button>
        </div>
      </div>
      <div class="guest-result" id="guest-result" hidden></div>
      <div class="guest-dealers" id="guest-dealers"></div>
    </section>
    <div style="margin-top:40px;text-align:right">
      <button class="btn danger sm" id="reset">Archive &amp; reset today's queue</button>
    </div>
  </main>

  <div class="q-scrim" id="q-scrim" hidden></div>
  <aside class="q-drawer" id="q-drawer" role="dialog" aria-modal="true" aria-labelledby="q-guest-name" tabindex="-1" hidden></aside>

  <script src="/common.js"></script>
  <script>
    let pin = sessionStorage.getItem('xpq-pin');
    let state = null;
    $('#guest-upload').onclick = () => $('#guest-file').click();

    async function login(p) {
      await api('/api/staff/login', { method: 'POST', pin: p });
      pin = p;
      sessionStorage.setItem('xpq-pin', p);
      $('#login').hidden = true;
      $('#console').hidden = false;
      $('#logout').hidden = false;
      load();
      api('/api/staff/guests', { pin }).then(renderGuests).catch(() => {});
      loadReportDays();
    }

    $('#login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      login($('#pin').value).catch((err) => ($('#login-err').textContent = err.message));
    });
    $('#logout').onclick = (e) => {
      e.preventDefault();
      sessionStorage.removeItem('xpq-pin');
      location.reload();
    };

    async function load() {
      if (reorderView.drag || reorderView.saving || fleetView.saving.size) return;
      const version = ++reorderView.version;
      try {
        const loaded = await api('/api/staff/tickets', { pin });
        if (version !== reorderView.version || reorderView.drag || reorderView.saving || fleetView.saving.size) return;
        state = loaded;
        render();
      } catch (err) {
        if (err.status === 401) $('#logout').click();
      }
    }

    const genderLabel = (gender) => gender === 'male' ? 'Male' : gender === 'female' ? 'Female' : '';

    // View state lives outside the polled data and is scoped by ticket/model identity.
    const queueView = { search: '', filter: 'all', selected: null, recentOpen: new Set(), recentAll: new Set() };
    let guestOpener = null;
    const documentImages = new Map();
    const reorderView = { drag: null, saving: false, version: 0 };
    const fleetView = { saving: new Set() };
    const orderKey = (ticket) => ticket.queueAt ?? ticket.createdAt;

    function moveId(ids, id, offset) {
      const next = [...ids];
      const from = next.indexOf(id);
      const to = from + offset;
      if (from < 0 || to < 0 || to >= next.length) return next;
      next.splice(from, 1);
      next.splice(to, 0, id);
      return next;
    }

    function focusHandle(id) {
      const handle = Array.from($('#cols').querySelectorAll('[data-handle]')).find((el) => el.dataset.handle === id);
      if (handle) handle.focus();
    }

    async function saveOrder(model, ids, focusId) {
      if (reorderView.saving || queueView.search.trim() || queueView.filter !== 'all') return;
      const waiting = state.tickets.filter((t) => t.model === model && t.status === 'waiting').sort((a, b) => orderKey(a) - orderKey(b));
      const keys = waiting.map(orderKey);
      const original = waiting.map((ticket) => ({ ticket, queueAt: ticket.queueAt }));
      const byId = new Map(waiting.map((t) => [t.id, t]));
      let previous = -Infinity;
      ids.forEach((id, i) => {
        const key = Math.max(keys[i], previous + 1);
        byId.get(id).queueAt = key;
        previous = key;
      });
      reorderView.saving = true;
      ++reorderView.version; // Ignore any poll started before the optimistic move.
      render();
      if (focusId) focusHandle(focusId);
      try {
        await api('/api/staff/reorder', { method: 'POST', pin, body: { model, ids } });
      } catch (err) {
        original.forEach(({ ticket, queueAt }) => {
          if (queueAt === undefined) delete ticket.queueAt;
          else ticket.queueAt = queueAt;
        });
        toast(err.message);
      } finally {
        reorderView.saving = false;
        render();
        await load();
      }
    }

    function moveWaiting(id, offset) {
      if (reorderView.drag || reorderView.saving || queueView.search.trim() || queueView.filter !== 'all') return;
      const ticket = state.tickets.find((t) => t.id === id && t.status === 'waiting');
      if (!ticket) return;
      const ids = state.tickets.filter((t) => t.model === ticket.model && t.status === 'waiting')
        .sort((a, b) => orderKey(a) - orderKey(b)).map((t) => t.id);
      const next = moveId(ids, id, offset);
      if (next.some((value, i) => value !== ids[i])) return saveOrder(ticket.model, next, id);
    }

    function filterTickets(items, query) {
      const text = query.trim().toLowerCase();
      if (!text) return items;
      const phone = text.replace(/[\s-]/g, '');
      return items.filter((t) => [t.number, t.name].some((value) => String(value || '').toLowerCase().includes(text)) ||
        (phone && String(t.phone || '').replace(/[\s-]/g, '').toLowerCase().includes(phone)));
    }

    function visibleTickets(items, query, recent, showAll) {
      const matches = filterTickets(items, query);
      return recent && !query.trim() && !showAll ? matches.slice(0, 5) : matches;
    }

    function formatWait(minutes) {
      const m = Math.max(0, Math.floor(minutes));
      return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`;
    }

    function longestWait(tickets, now = Date.now()) {
      const waiting = tickets.filter((t) => t.status === 'waiting');
      return waiting.length ? formatWait(Math.max(...waiting.map((t) => (now - t.createdAt) / 60000))) : '—';
    }

    function filterRegistered(items, filter) {
      return filter === 'pre' ? items.filter((t) => t.guestMatched === true) : items;
    }

    function drainTimeText(model, count) {
      const minutes = Math.ceil(Math.max(0, Number(model.minutes) || 0) * count / Math.max(1, Number(model.units) || 1));
      return `${count} waiting · about ${minutes}m of drives to clear the line`;
    }

    function fleetAvailability(units = 1, driving = 0) {
      const free = Math.max(0, units - driving);
      const text = driving > units ? `${units} of ${units} out (+${driving - units} over)`
        : free === 0 ? `All ${units} cars out` : `Cars: ${free} of ${units} free`;
      return { free, text };
    }

    async function changeFleet(modelId, offset) {
      if (fleetView.saving.has(modelId)) return;
      const model = state.models.find((m) => m.id === modelId);
      if (!model) return;
      const original = model.units;
      const units = original + offset;
      if (units < 0 || units > 50) return;
      fleetView.saving.add(modelId);
      ++reorderView.version; // Discard polls begun before this edit, including after it settles.
      model.units = units;
      render();
      try {
        const result = await api('/api/staff/fleet', { method: 'POST', pin, body: { model: modelId, units } });
        model.units = result.units;
      } catch (err) {
        model.units = original;
        toast(err.message);
      } finally {
        fleetView.saving.delete(modelId);
        render();
        await load();
      }
    }

    function fleetControls(model, driving) {
      const units = model.units ?? 1;
      const { free, text } = fleetAvailability(units, driving);
      const name = model.name.replace(/^JAECOO\s+/, '');
      return `<div class="q-fleet${free === 0 ? ' out' : ''}"><span>${text}</span><span class="q-fleet-buttons" aria-label="Demo car total">
        <button type="button" data-key="fleet-less" data-fleet="${esc(model.id)}" data-offset="-1" aria-label="Fewer ${esc(name)} cars" ${units === 0 || fleetView.saving.has(model.id) ? 'disabled' : ''}>&minus;</button>
        <button type="button" data-key="fleet-more" data-fleet="${esc(model.id)}" data-offset="1" aria-label="More ${esc(name)} cars" ${units === 50 || fleetView.saving.has(model.id) ? 'disabled' : ''}>+</button>
      </span></div>`;
    }

    function matching(items) {
      return filterTickets(filterRegistered(items, queueView.filter), queueView.search);
    }

    function ticketActions(t) {
      return {
        waiting: [['call', 'Call'], ['noshow', 'No-show', 'red']],
        called: [['call', 'Recall'], ['start', 'Start drive', 'dark'], ['noshow', 'No-show', 'red']],
        driving: [['finish', 'Finish drive', 'dark']],
        noshow: [['requeue', 'Re-queue']],
      }[t.status] || [];
    }

    function actionButtons(t) {
      return ticketActions(t).map(([act, label, cls = '']) => `<button type="button" class="q-mini ${cls}" data-key="act-${act}" data-id="${esc(t.id)}" data-act="${act}" aria-label="${label} ${esc(t.number)}">${label}</button>`).join('');
    }

    function smsBadge(t) {
      const labels = { Pending: 'SMS sending…', Processed: 'SMS sending…', Sent: 'SMS sent', Delivered: 'SMS delivered ✓', Failed: 'SMS failed', Skipped: 'SMS off' };
      const sms = t.callSms;
      return sms && labels[sms.state] ? `<span class="pill q-sms sms-${esc(sms.state.toLowerCase())}"${sms.state === 'Failed' && sms.error ? ` title="${esc(sms.error)}"` : ''}>${labels[sms.state]}</span>` : '';
    }

    function row(t, position, total) {
      const reorder = position && !queueView.search.trim() && queueView.filter === 'all';
      return `<li class="q-r ${queueView.selected === t.id ? 'sel' : ''}" data-key="ticket-${esc(t.id)}" data-ticket="${esc(t.id)}" data-open="${esc(t.id)}" tabindex="0" aria-label="Details ${esc(t.number)} ${esc(t.name)}">
        ${position ? `<span class="pos" aria-label="Position ${position}">${position}.</span>` : ''}
        <span class="q-num">${esc(t.number)}</span><span class="nm">${esc(t.name)}${t.guestMatched === true ? '<span class="q-f">Pre-registered</span>' : ''}</span>
        <span class="w">${t.status === 'waiting' ? formatWait((Date.now() - t.createdAt) / 60000) : esc(STATUS_LABEL[t.status] || t.status)}</span>
        ${reorder ? `<span class="q-reorder" data-key="reorder-${esc(t.id)}">
          <button type="button" class="reorder-handle" draggable="${!reorderView.saving}" data-handle="${esc(t.id)}" aria-label="Drag to reorder ${esc(t.number)}" aria-disabled="${reorderView.saving}" title="Drag or use ArrowUp / ArrowDown">⋮⋮</button>
          <button type="button" data-move="${esc(t.id)}" data-offset="-1" aria-label="Move ${esc(t.number)} up" ${position === 1 || reorderView.saving ? 'disabled' : ''}>▲</button>
          <button type="button" data-move="${esc(t.id)}" data-offset="1" aria-label="Move ${esc(t.number)} down" ${position === total || reorderView.saving ? 'disabled' : ''}>▼</button>
        </span>` : ''}
        <span class="q-actions">${actionButtons(t)}</span>
      </li>`;
    }

    function slot(t, model) {
      const driving = t.status === 'driving';
      const elapsed = Math.max(0, Math.floor((Date.now() - t.startedAt) / 60000));
      const over = elapsed > model.minutes;
      return `<div class="q-slot ${driving ? 'drive' : 'call'}" data-key="ticket-${esc(t.id)}" data-open="${esc(t.id)}" tabindex="0" aria-label="Details ${esc(t.number)} ${esc(t.name)}">
        <span class="lab">${driving ? 'On the road' : 'Calling'}</span>
        <span class="nm"><span class="q-num">${esc(t.number)}</span> ${esc(t.name)}</span>
        <span class="q-actions">${actionButtons(t)}</span>
        <span class="sub">${driving ? `${elapsed} of ${model.minutes} min · ${over ? '<b class="over">running over</b>' : 'back about ' + staffClock(t.startedAt + model.minutes * 60000)}` : `called ${ago(t.calledAt)}${t.callCount > 1 ? ` · ${t.callCount} calls` : ''} ${smsBadge(t)}`}</span>
        ${driving ? `<div class="q-bar ${over ? 'over' : ''}"><i style="width:${Math.min(100, elapsed / Math.max(1, model.minutes) * 100)}%"></i></div>` : ''}
      </div>`;
    }

    function recentSection(items, model) {
      const filtered = !!queueView.search.trim() || queueView.filter !== 'all';
      const matches = matching(items);
      const visible = visibleTickets(matches, queueView.search, true, queueView.recentAll.has(model));
      const open = queueView.recentOpen.has(model);
      return `<section class="q-recent" data-key="recent-${esc(model)}">
        <button type="button" class="q-recent-toggle" data-section="${esc(model)}" aria-controls="recent-${esc(model)}" aria-expanded="${open}" aria-label="Recent ${esc(model)}">${open ? '▾' : '▸'} Recent (${filtered ? matches.length + ' of ' : ''}${items.length})</button>
        <div id="recent-${esc(model)}"${open ? '' : ' hidden'}>
          ${visible.length ? `<ul class="q-rows">${visible.map((t) => row(t)).join('')}</ul>` : '<div class="q-empty">No matches</div>'}
          ${!queueView.search.trim() && matches.length > 5 ? `<button type="button" class="q-more" data-recent="${esc(model)}" aria-expanded="${queueView.recentAll.has(model)}" aria-label="${queueView.recentAll.has(model) ? 'Show less' : 'Show all (' + matches.length + ')'} recent ${esc(model)}">${queueView.recentAll.has(model) ? 'Show less' : 'Show all (' + matches.length + ')'}</button>` : ''}
        </div>
      </section>`;
    }

    function staffClock(ms) {
      return ms ? new Date(ms).toLocaleTimeString('en-PH', { timeZone: 'Asia/Manila', hour: 'numeric', minute: '2-digit' }) : '—';
    }

    // Reuse keyed rows and controls so polling doesn't replace focused elements.
    function syncQueueDOM(target, source) {
      const keyed = new Map(Array.from(target.children).filter((el) => el.dataset.key).map((el) => [el.dataset.key, el]));
      let cursor = target.firstChild;
      for (const next of Array.from(source.childNodes)) {
        const key = next.nodeType === 1 && next.dataset.key;
        let current = key ? keyed.get(key) : cursor;
        if (current && (current.nodeType !== next.nodeType || current.nodeName !== next.nodeName ||
            (!key && current.nodeType === 1 && current.dataset.key))) current = null;
        if (!current) {
          current = next.cloneNode(true);
          target.insertBefore(current, cursor);
        } else {
          if (current !== cursor) target.insertBefore(current, cursor);
          if (current.nodeType === 1) {
            for (const attr of Array.from(current.attributes)) if (!next.hasAttribute(attr.name)) current.removeAttribute(attr.name);
            for (const attr of Array.from(next.attributes)) if (current.getAttribute(attr.name) !== attr.value) current.setAttribute(attr.name, attr.value);
            syncQueueDOM(current, next);
          } else if (current.nodeValue !== next.nodeValue) current.nodeValue = next.nodeValue;
        }
        cursor = current.nextSibling;
      }
      while (cursor) { const next = cursor.nextSibling; cursor.remove(); cursor = next; }
    }

    function render() {
      if (reorderView.drag) return;
      $('#date').textContent = new Date(state.date + 'T00:00').toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
      const by = (s) => state.tickets.filter((t) => t.status === s);
      const waitingAll = by('waiting');
      updateMarkup($('#summary'), [
        ['wait', waitingAll.length, 'waiting'], ['call', by('called').length, 'calling'],
        ['drive', by('driving').length, 'on the road'], ['done', by('done').length, 'drives done'],
        ['', longestWait(state.tickets), 'longest wait'],
        ['', state.models.reduce((sum, m) => sum + fleetAvailability(m.units, by('driving').filter((t) => t.model === m.id).length).free, 0), 'cars free'],
      ].map(([c, n, label]) => `<span class="q-kpi" data-key="${label}">${c ? `<i class="${c}" aria-hidden="true"></i>` : ''}<b>${n}</b>${label}</span>`).join(''));
      updateMarkup($('#q-filters'), [['all', 'Everyone', waitingAll.length], ['pre', 'Pre-registered', filterRegistered(waitingAll, 'pre').length]]
        .map(([value, label, count]) => `<button type="button" class="q-chip" data-key="${value}" data-filter="${value}" aria-pressed="${queueView.filter === value}">${label}<span class="c">${count}</span></button>`).join(''));
      const filtered = !!queueView.search.trim() || queueView.filter !== 'all';
      updateMarkup($('#cols'), state.models.map((m) => {
        const mine = state.tickets.filter((t) => t.model === m.id);
        const pick = (...s) => mine.filter((t) => s.includes(t.status));
        const waiting = pick('waiting').sort((a, b) => orderKey(a) - orderKey(b));
        const list = matching(waiting);
        const recent = pick('done', 'noshow', 'cancelled').sort((a, b) => (b.finishedAt || 0) - (a.finishedAt || 0));
        const slots = (status, label, empty) => {
          const all = pick(status), found = matching(all);
          const free = fleetAvailability(m.units, all.length).free;
          const availability = status === 'driving' && free > 0 && (m.units ?? 1) !== 1 ? `<div class="q-slot empty" data-key="free-cars"><span class="lab">${label}</span>${free} free</div>` : '';
          return (found.map((t) => slot(t, m)).join('') + availability) || `<div class="q-slot empty" data-key="empty-${status}"><span class="lab">${label}</span>${all.length ? 'No matches' : empty}</div>`;
        };
        return `<section class="q-lane" data-key="model-${esc(m.id)}">
          <div class="q-lane-head">
            <img src="${esc(m.image)}" alt="" />
            <div><h2>${esc(m.name)}<small>${esc(m.tagline || m.brand || '')}</small></h2><div class="q-meta">${drainTimeText(m, waiting.length)}</div>${fleetControls(m, pick('driving').length)}</div>
            <button type="button" class="q-callnext" data-next="${esc(m.id)}" aria-label="Call next ${waiting[0] ? esc(waiting[0].number) + ' · ' : ''}${esc(m.name)}" ${waiting.length ? '' : 'disabled'}>Call next${waiting[0] ? ` <span class="q-num">${esc(waiting[0].number)}</span>` : ''}</button>
          </div>
          <div class="q-now">${slots('driving', 'On the road', (m.units ?? 1) === 1 ? 'Car is free' : fleetAvailability(m.units, pick('driving').length).text)}${slots('called', 'Calling', 'Nobody is being called')}</div>
          <div class="q-sect"><span>In line (${filtered ? list.length + ' of ' : ''}${waiting.length})</span></div>
          ${filtered ? '<p class="q-reorder-note">Show Everyone and clear search to reorder</p>' : ''}
          ${list.length ? `<ul class="q-rows" data-waiting-model="${esc(m.id)}">${list.map((t) => row(t, waiting.indexOf(t) + 1, waiting.length)).join('')}</ul>` : `<div class="q-empty">${filtered ? 'No matches. Show Everyone or clear the search.' : 'No one is waiting for this car.'}</div>`}
          ${recentSection(recent, m.id)}
        </section>`;
      }).join(''));
      renderDrawer();
    }

    function updateMarkup(target, html) {
      const template = document.createElement('template');
      template.innerHTML = html;
      syncQueueDOM(target, template.content);
    }

    function docTile(t, side, has, label) {
      if (!has) return `<div class="q-doc empty">No ${label.toLowerCase()} on file</div>`;
      const endpoint = '/api/staff/license/' + encodeURIComponent(t.id) + '?side=' + side;
      if (!documentImages.has(endpoint)) {
        documentImages.set(endpoint, null);
        fetch(endpoint, { headers: { 'x-staff-pin': pin } })
          .then((r) => r.ok ? r.blob() : null)
          .then((blob) => documentImages.set(endpoint, blob ? URL.createObjectURL(blob) : ''))
          .catch(() => documentImages.set(endpoint, ''))
          .finally(() => { if (queueView.selected === t.id) renderDrawer(); });
      }
      const url = documentImages.get(endpoint);
      return `<button type="button" class="q-doc ${side}" data-key="doc-${side}" data-photo="${esc(t.id)}" data-number="${esc(t.number)}" data-side="${side}" aria-label="View ${label.toLowerCase()} ${esc(t.number)}">${url ? `<img src="${url}" alt="${label}" />` : `<span>${url === '' ? 'Not on file' : 'Loading…'}</span>`}<span class="cap">${label}</span></button>`;
    }

    function renderDrawer() {
      const t = state.tickets.find((t) => t.id === queueView.selected);
      if (!t) { if (queueView.selected) closeGuest(); return; }
      const model = state.models.find((m) => m.id === t.model);
      const values = [
        ['Status', STATUS_LABEL[t.status] || t.status], ['Model', model?.name || t.model],
        ['Phone', t.phone], ['Email', t.email], ['Municipality', t.municipality],
        ['Customer type', state.customerTypes?.[t.customerType] || t.customerType],
        ['Gender', genderLabel(t.gender)], ['Dealer', t.dealer], ['Sales executive', t.salesExecutive],
        ['Test drive resource', state.testDriveResources?.[t.testDriveResource] || t.testDriveResource],
        ['Registered', new Date(t.createdAt).toLocaleString('en-PH', { timeZone: 'Asia/Manila' })],
        ['License number', t.licenseNumber],
      ];

      if (!handle || !['ArrowUp', 'ArrowDown'].includes(e.key)) return;

    $('#cols').addEventListener('dragstart', (e) => {

      const list = handle && handle.closest('[data-waiting-model]');
      if (!list || reorderView.saving || queueView.search.trim() || queueView.filter !== 'all') { e.preventDefault(); return; }
      reorderView.drag = { id: handle.dataset.handle, model: list.dataset.waitingModel,
        ids: Array.from(list.querySelectorAll('[data-ticket]'), (el) => el.dataset.ticket) };
      ++reorderView.version;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', handle.dataset.handle);

    function dropTarget(e) {
      const drag = reorderView.drag;
      const list = e.target.closest('[data-waiting-model]');
      if (!drag || !list || list.dataset.waitingModel !== drag.model || queueView.search.trim() || queueView.filter !== 'all') return null;
      const row = e.target.closest('[data-ticket]') || list.lastElementChild;
      if (!row) return null;
      const bounds = row.getBoundingClientRect();
      return { row, after: e.clientY >= bounds.top + bounds.height / 2 };
    }

      const targetId = target.row.dataset.ticket;
      if (targetId === drag.id) { cancelDrag(); return; }
      ids.splice(ids.indexOf(targetId) + (target.after ? 1 : 0), 0, drag.id);

    // ---- Daily report (Excel) ----
    // Anyone who registered but never drove counts as a no-show once the day is over.
    function driveStatus(t, isToday) {
      switch (t.status) {
        case 'done': return ['Completed', ''];
        case 'noshow': return ['No-show', 'Did not show up'];
        case 'cancelled': return ['Cancelled', 'Left the queue or removed by staff'];
        case 'driving': return isToday ? ['On test drive', 'In progress'] : ['Completed', 'Drive was not marked finished'];
        case 'called': return isToday ? ['Called', 'In progress'] : ['No-show', 'Called, test drive never started'];
        default: return isToday ? ['Waiting', 'In progress'] : ['No-show', 'Registered, never called'];
      }
    }
    const manilaTime = (ms) => (ms ? new Date(ms).toLocaleTimeString('en-PH', { timeZone: 'Asia/Manila', hour: '2-digit', minute: '2-digit' }) : '');
    const minutesBetween = (a, b) => (a && b ? Math.round((b - a) / 60000) : '');
    const average = (xs) => (xs.length ? Math.round(xs.reduce((s, x) => s + x, 0) / xs.length) : '');

    function reportRows(data) {
      const isToday = data.date === data.today;
      return data.tickets.map((t) => {
        const [status, remarks] = driveStatus(t, isToday);
        return { t, status, remarks };
      });
    }
    function registrationRows(data) {
      return [
        ['Date', 'Queue No.', 'Preferred Model', 'Complete Name', 'Gender', 'Mobile Number', 'E-mail Address', 'Municipality', 'Customer Type', 'Location/Dealer',
          'Assigned Sales Executive', 'Test Drive Resource', 'On Dealer Guest List', 'License No.', 'License Expiry', 'Data Privacy Consent', 'Signature on file', 'License Back Photo',
          'Test Drive Status', 'Remarks', 'Registered', 'Called', 'Drive Started', 'Finished', 'Wait (min)', 'Drive (min)', 'Call SMS status'],
        ...reportRows(data).map(({ t, status, remarks }) => [
          new Date(t.createdAt).toLocaleDateString('en-CA', { timeZone: 'Asia/Manila' }), t.number, (data.models.find((m) => m.id === t.model) || {}).name || t.model,
          t.name, genderLabel(t.gender), t.phone, t.email || '', t.municipality || '', (data.customerTypes || {})[t.customerType] || t.customerType || '', t.dealer || '',
          t.salesExecutive || '', (data.testDriveResources || {})[t.testDriveResource] || t.testDriveResource || '', t.guestMatched ? 'Yes' : 'No',
          t.licenseNumber || '', cardDate(t.licenseExpiry), t.consentAt ? 'Yes' : 'No', t.hasSignature ? 'Yes' : 'No', t.hasLicensePhotoBack ? 'Yes' : 'No',
          status, remarks, manilaTime(t.createdAt), manilaTime(t.calledAt), manilaTime(t.startedAt),
          t.status === 'done' || t.status === 'noshow' || t.status === 'cancelled' ? manilaTime(t.finishedAt) : '', minutesBetween(t.createdAt, t.calledAt), minutesBetween(t.startedAt, t.finishedAt), t.callSms?.state || '',
        ]),
      ];
    }
    function buildReportWorkbook(data) {
      const isToday = data.date === data.today;
      const rows = reportRows(data);
      const list = registrationRows(data);

      const count = (subset, s) => subset.filter((r) => r.status === s).length;
      const statusCols = isToday ? ['Completed', 'No-show', 'Cancelled', 'On test drive', 'Called', 'Waiting'] : ['Completed', 'No-show', 'Cancelled'];
      const line = (label, subset) => [
        label, subset.length, ...statusCols.map((s) => count(subset, s)),
        average(subset.filter((r) => r.t.calledAt).map((r) => minutesBetween(r.t.createdAt, r.t.calledAt))),
        average(subset.filter((r) => r.t.status === 'done' && r.t.startedAt).map((r) => minutesBetween(r.t.startedAt, r.t.finishedAt))),
      ];
      const header = ['', 'Registered', ...statusCols, 'Avg wait (min)', 'Avg drive (min)'];
      const group = (title, keyOf, labelOf) => {
        const keys = [...new Set(rows.map((r) => keyOf(r.t)))].filter((k) => k);
        return keys.length ? [[], [title], header, ...keys.map((k) => line(labelOf(k), rows.filter((r) => keyOf(r.t) === k)))] : [];
      };
      const summary = [
        ['OMODA & JAECOO Test Drive — Daily Report'],
        ['Date', cardDate(data.date) + (isToday ? ' (today, still in progress)' : '')],
        ['Generated', new Date().toLocaleString('en-PH', { timeZone: 'Asia/Manila' })],
        [],
        header,
        line('All models', rows),
        ...data.models.map((m) => line(m.name, rows.filter((r) => r.t.model === m.id))),
        ...group('By customer type', (t) => t.customerType, (k) => data.customerTypes[k] || k),
        ...group('By location/dealer', (t) => t.dealer, (k) => k),
        ...group('By test drive resource', (t) => t.testDriveResource, (k) => (data.testDriveResources || {})[k] || k),
      ];

      const book = XLSX.utils.book_new();
      const listSheet = XLSX.utils.aoa_to_sheet(list);
      listSheet['!cols'] = [12, 12, 22, 24, 10, 16, 26, 18, 30, 22, 26, 22, 18, 18, 14, 20, 18, 20, 18, 30, 12, 12, 14, 12, 12, 12, 18].map((wch) => ({ wch }));
      listSheet['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: list.length - 1, c: list[0].length - 1 } }) };
      const summarySheet = XLSX.utils.aoa_to_sheet(summary);
      summarySheet['!cols'] = [{ wch: 38 }, ...header.slice(1).map(() => ({ wch: 14 }))];
      XLSX.utils.book_append_sheet(book, summarySheet, 'Summary');
      XLSX.utils.book_append_sheet(book, listSheet, 'Registrations');
      return book;
    }

    // The display's chime / announce endpoint / browser fallback, queued locally.
    // Only successful calls from this device enqueue audio; polling never speaks.
    let announceHere = localStorage.getItem('oj-staff-announce') === '1';
    const announcements = (() => {
      const pending = [];
      let busy = false;
      let voices = [];
      let synth;
      let currentUtterance;
      let audio;
      let voiceRetryAt = 0;
      let generation = 0;
      let stopAudio, stopSpeech, voiceController;
      try {
        if (window.speechSynthesis && window.SpeechSynthesisUtterance) {
          synth = window.speechSynthesis;
          const loadVoices = () => { try { voices = synth.getVoices(); } catch {} };
          loadVoices();
          synth.onvoiceschanged = loadVoices;
        }
      } catch {}
      const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      function resume() {
        try { if (synth?.paused) synth.resume(); } catch {}
      }
      function speak(text) {
        return new Promise((resolve) => {
          if (!synth || !announceHere) return resolve();
          let utterance;
          let watchdog;
          let settled = false;
          const finish = () => {
            if (settled) return;
            settled = true;
            clearTimeout(watchdog);
            if (currentUtterance === utterance) currentUtterance = null;
            stopSpeech = null;
            resolve();
          };
          try {
            voices = synth.getVoices();
            const english = voices.filter((v) => /^en(?:-|$)/i.test(v.lang));
            const voice = english.find((v) => /^en-PH$/i.test(v.lang))
              || english.find((v) => /Natural|Online|Google/i.test(v.name))
              || english.find((v) => /^en-(US|GB)$/i.test(v.lang))
              || english.find((v) => v.default);
            utterance = new window.SpeechSynthesisUtterance(text);
            if (voice) utterance.voice = voice;
            utterance.lang = voice?.lang || 'en-US';
            utterance.rate = 0.95;
            utterance.pitch = 1;
            utterance.volume = 1;
            utterance.onend = utterance.onerror = finish;
            currentUtterance = utterance;
            stopSpeech = finish;
            watchdog = setTimeout(() => {
              if (settled) return;
              try {
                if (currentUtterance === utterance) synth.cancel();
              } catch {} finally { finish(); }
            }, Math.max(6000, text.length * 150));
            resume();
            synth.speak(utterance);
          } catch { finish(); }
        });
      }

      function unlockAudio() {
        try {
          // Reuse this element for real calls so its play permission comes from the click.
          audio = new Audio('data:audio/wav;base64,UklGRiUAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQEAAACA');
          void Promise.resolve(audio.play()).catch(() => {});
        } catch {}
      }
      function playAudio() {
        return new Promise((resolve, reject) => {
          let settled = false;
          let watchdog;
          const finish = (error) => {
            if (settled) return;
            settled = true;
            clearTimeout(watchdog);
            audio.onended = audio.onerror = audio.onloadedmetadata = null;
            stopAudio = null;
            try { audio.pause(); } catch {}
            if (error) reject(error); else resolve();
          };
          const armWatchdog = () => {
            clearTimeout(watchdog);
            const duration = Number.isFinite(audio.duration) ? audio.duration * 1000 : 0;
            watchdog = setTimeout(() => finish(new Error('Audio playback timed out')), Math.max(8000, duration + 3000));
          };
          try {
            stopAudio = () => finish(new Error('Announcement stopped'));
            audio.currentTime = 0;
            audio.onended = () => finish();
            audio.onerror = () => finish(new Error('Audio playback failed'));
            audio.onloadedmetadata = armWatchdog;
            armWatchdog();
            Promise.resolve(audio.play()).catch(() => finish(new Error('Audio playback failed')));
          } catch (error) { finish(error); }
        });
      }
      async function serverVoice(number, version) {
        if (!number || !audio || Date.now() < voiceRetryAt) return false;
        let url;
        let playedOnce = false;
        try {
          const controller = new AbortController();
          voiceController = controller;
          const timer = setTimeout(() => controller.abort(), 10000); // uncached generation can take ~4-5 s
          let blob;
          try {
            // Recalls use the same number/URL: always ask the server for its current calledAt cache key.
            const response = await fetch(`/api/announce?number=${encodeURIComponent(number)}`, { signal: controller.signal, cache: 'no-store' });
            if (response.status !== 200) {
              if (response.status === 503) {
                const data = await response.json().catch(() => ({}));
                if (data.error === 'Voice not configured') voiceRetryAt = Date.now() + 5 * 60 * 1000;
              }
              return false;
            }
            blob = await response.blob();
          } finally { clearTimeout(timer); voiceController = null; }
          if (!announceHere || version !== generation) return true;
          url = URL.createObjectURL(blob);
          audio.src = url;
          await playAudio();
          playedOnce = true;
          document.body.dataset.voice = 'server';
          await delay(1000);
          if (announceHere && version === generation) await playAudio();
          document.body.dataset.voice = 'server';
          return true;
        } catch {
          return playedOnce;
        } finally {
          if (url) {
            try { audio.pause(); audio.removeAttribute('src'); audio.load(); } catch {}
            URL.revokeObjectURL(url);
          }
        }
      }
      async function drain() {
        if (busy || document.hidden || !announceHere) return;
        busy = true;
        try {
          while (pending.length && !document.hidden && announceHere) {
            const { text, number } = pending.shift();
            const version = generation;
            chime();
            await delay(900); // The existing chime's last oscillator stops at 870 ms.
            if (!announceHere || version !== generation) continue;
            if (await serverVoice(number, version)) continue;
            if (!announceHere || version !== generation) continue;
            document.body.dataset.voice = 'browser';
            await speak(text);
            if (synth && announceHere && version === generation) {
              await delay(1000);
              if (version === generation) await speak(text);
            }
          }
        } finally {
          busy = false;
        }
      }
      function enqueue(text, number) {
        pending.push({ text, number });
        if (pending.length > 5) pending.splice(0, pending.length - 5);
        void drain();
      }
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (pending.length > 5) pending.splice(0, pending.length - 5);
        } else {
          resume();
          void drain();
        }
      });
      return {
        unlock() { if (!audio) unlockAudio(); resume(); },
        stop() {
          generation++;
          pending.length = 0;
          voiceController?.abort();
          stopAudio?.();
          stopSpeech?.();
          try { audio?.pause(); synth?.cancel(); } catch {}
        },
        call(ticket) { if (announceHere) enqueue(callAnnouncementText(ticket), ticket.number); },
      };
    })();

    function showAnnounce() {
      $('#announce').setAttribute('aria-pressed', String(announceHere));
    }
    $('#announce').onclick = () => {
      announceHere = !announceHere;
      localStorage.setItem('oj-staff-announce', announceHere ? '1' : '0');
      showAnnounce();
      if (announceHere) { announcements.unlock(); chime(); }
      else announcements.stop();
    };
    showAnnounce();

    async function queueClick(e) {
      const b = e.target.closest('button');
      if (b) {
        if (b.dataset.fleet) return changeFleet(b.dataset.fleet, Number(b.dataset.offset));
        if (b.dataset.handle) return;
        if (b.dataset.move) return moveWaiting(b.dataset.move, Number(b.dataset.offset));
        if (b.dataset.section || b.dataset.recent) {
          const set = b.dataset.section ? queueView.recentOpen : queueView.recentAll;
          const key = b.dataset.section || b.dataset.recent;
          if (set.has(key)) set.delete(key); else set.add(key);
          return render();
        }
        if (b.hasAttribute('data-close-drawer')) return closeGuest();
        if (b.dataset.photo) return viewLicense(b.dataset.photo, b.dataset.number, b.dataset.side);
        if (!b.dataset.next && !b.dataset.act) return;
        if (announceHere) announcements.unlock(); // Stay within the user's click gesture.
        b.disabled = true;
        try {
          let ticket;
          if (b.dataset.next) {
            ({ ticket } = await api('/api/staff/next/' + b.dataset.next, { method: 'POST', pin }));
          } else {
            ({ ticket } = await api(`/api/staff/tickets/${b.dataset.id}/${b.dataset.act}`, { method: 'POST', pin }));
          }
          if (b.dataset.next || b.dataset.act === 'call') {
            toast(`Calling ${ticket.number} \u2014 ${ticket.name}`);
            announcements.call(ticket);
          }
          await load();
        } catch (err) {
          toast(err.message);
          b.disabled = false;
        }
        return;
      }
      const row = e.target.closest('[data-open]');
      if (row) openGuest(row.dataset.open, row);
    }
    $('#cols').addEventListener('click', queueClick);
    $('#q-drawer').addEventListener('click', queueClick);
    $('#q-scrim').addEventListener('click', closeGuest);
    document.addEventListener('keydown', (e) => {
      if ($('.modal-backdrop')) return;
      if (queueView.selected) {
        if (e.key === 'Escape') { e.preventDefault(); closeGuest(); return; }
        if (e.key === 'Tab') {
          const controls = Array.from($('#q-drawer').querySelectorAll('button:not(:disabled), [tabindex="0"]'));
          const first = controls[0], last = controls[controls.length - 1];
          if (e.shiftKey && (document.activeElement === first || document.activeElement === $('#q-drawer'))) {
            e.preventDefault(); last?.focus();
          } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first?.focus(); }
        }
        return;
      }
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-open]')) {
        e.preventDefault(); openGuest(e.target.dataset.open, e.target);
      }
    });

    $('#reset').onclick = async () => {
      const ok = await confirmModal({
        title: "Reset today's queue?",
        message: 'All current tickets will be archived and numbering restarts from 001. This cannot be undone from here.',
        confirmText: 'Reset queue',
        danger: true,
      });
      if (!ok) return;
      await api('/api/staff/reset', { method: 'POST', pin }).catch((e) => toast(e.message));
      load();
    };

    // Staff needs unmasked phones, so poll its own endpoint instead of the public one.
    setInterval(() => pin && !$('#console').hidden && !document.hidden && load(), POLL_MS);
    document.addEventListener('visibilitychange', () => !document.hidden && pin && load());
    if (pin) login(pin).catch(() => sessionStorage.removeItem('xpq-pin'));
  </script>
</body>
</html>
