<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OMODA & JAECOO Queue — Lobby Display</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    :root {
      color-scheme: light;
      --d-bg: #fff; --d-ink: #1f2933; --d-ink-2: #5f6b76; --d-ink-3: #5f6b76;
      --d-line: #dfe3e8; --d-chip-ink: #1f2933; --d-idle: #5f6b76; --d-btn: #fff; --d-number: #0e7490;
    }
    :root[data-theme='dark'] {
      color-scheme: dark;
      --d-bg: #0d0d0d; --d-ink: #fff; --d-ink-2: #ccc; --d-ink-3: #aaa;
      --d-line: #383838; --d-chip-ink: #eee; --d-idle: #999; --d-btn: #141414; --d-number: #22d3ee;
    }
    :root[data-theme='dark'] .bar .logo { filter: brightness(0) invert(1); }
    body { background: var(--d-bg); color: var(--d-ink); }
    .bar { min-height: 80px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 20px 32px; background: var(--d-btn); color: var(--d-ink); border-bottom: 1px solid var(--d-line); }
    .bar .brand small { color: var(--d-ink-2); font-size: 12px; }
    .bar-right { display: flex; align-items: center; gap: 24px; }
    #clock { font-size: 26px; font-weight: 300; font-variant-numeric: tabular-nums; color: var(--d-ink); white-space: nowrap; }
    .board { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); min-height: calc(100dvh - 80px); }
    .lane { background: var(--d-btn); min-width: 0; padding: 20px 28px 44px; border-bottom: 1px solid var(--d-line); display: flex; flex-direction: column; }
    .lane:nth-child(even) { border-left: 1px solid var(--d-line); }
    .lane-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--d-line); }
    .lane-head img { width: 100px; order: 1; }
    .lane-head .name { font-size: clamp(18px, 1.4vw, 27px); font-weight: 400; letter-spacing: .05em; }
    .lane-head .sub { color: var(--d-ink-3); font-size: 13px; }
    .label { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--d-ink-3); margin: 12px 0 6px; }
    .now { font-size: clamp(32px, 3.8vw, 76px); font-weight: 300; letter-spacing: -.035em; line-height: 1.05; color: var(--d-number); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    .now.flash { animation: flash 1s ease-in-out 4; }
    @keyframes flash { 50% { color: var(--d-ink); } }
    .now-name { font-size: 22px; color: var(--d-ink-2); margin-top: 6px; min-height: 27px; overflow-wrap: anywhere; }
    .idle { font-size: clamp(32px, 3.8vw, 76px); color: var(--d-idle); font-weight: 300; line-height: 1.05; }
    .next { display: flex; gap: 8px; flex-wrap: wrap; }
    .next span { font-size: 18px; font-weight: 400; padding: 6px 8px; border: 1px solid var(--d-line); color: var(--d-chip-ink); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; max-width: 100%; }
    .next .none { border: 0; color: var(--d-ink-3); padding-left: 0; }
    .driving { color: var(--d-ink-2); font-size: 18px; overflow-wrap: anywhere; }
    .driving-strip { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin-top: 12px; }
    .driving-strip .label { margin: 0; }
    .foot { margin-top: auto; padding-top: 14px; color: var(--d-ink-3); font-size: 16px; }
    .chip-btn { background: var(--d-btn); color: var(--d-ink); border: 1px solid var(--d-line); padding: 10px 16px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
    .bar .chip-btn { color: var(--d-ink); background: transparent; border-color: var(--d-ink-3); }
    .chip-btn:hover { border-color: var(--d-ink); }
    :focus-visible { outline-color: var(--d-number); }
    .bar #sound { border-color: var(--d-number); color: var(--d-number); font-weight: 600; }
    @media (min-width: 1500px) {
      .lane { padding: 20px 28px 44px; }
      .next span { font-size: 20px; }
      .foot { font-size: 20px; }
    }
    @media (max-width: 1100px) {
      .board { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: auto; }
      .lane { padding-bottom: 36px; }
      .now, .idle { font-size: clamp(32px, 5.2vw, 64px); }
      .lane-head .name { font-size: 20px; }
      .lane-head img { width: 80px; }
    }
    @media (max-width: 640px) {
      .bar { flex-wrap: wrap; gap: 20px; padding: 20px; }
      .bar .brand small { display: none; }
      .bar-right { width: 100%; justify-content: space-between; }
      #clock { font-size: 22px; }
      .board { grid-template-columns: 1fr; }
      .lane, .lane:nth-child(even) { padding: 28px 20px 48px; border-left: 0; }
      .lane-head .name { font-size: 23px; }
      .lane-head img { width: 100px; }
      .now, .idle { font-size: clamp(36px, 11vw, 64px); }
      .now-name { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <span class="brand"><span class="logo" role="img" aria-label="OMODA &amp; JAECOO"></span> <small>Test Drive</small></span>
    <div class="bar-right">
      <!-- In the header (not fixed bottom-right) so hosting badges can never cover it. -->
      <button class="chip-btn" id="sound" title="Real calls use the AI voice when configured, otherwise the browser voice">Enable call sound</button>
      <button class="chip-btn" id="theme" title="Switch between dark and light"></button>
      <div id="clock"></div>
    </div>
  </div>
  <div class="board" id="board"></div>

  <script src="/common.js"></script>
  <script>
    let soundOn = false;
    let flashModel = null;

    // Theme: ?theme=light|dark in the URL wins, then the last choice on this screen, else light.
    const themeParam = new URLSearchParams(location.search).get('theme');
    let theme = ['light', 'dark'].includes(themeParam) ? themeParam : (localStorage.getItem('oj-display-theme') || 'light');
    function applyTheme() {
      document.documentElement.dataset.theme = theme;
      $('#theme').textContent = theme === 'dark' ? 'Light mode' : 'Dark mode';
    }
    $('#theme').onclick = () => {
      theme = theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('oj-display-theme', theme);
      applyTheme();
    };
    applyTheme();
    // Keep speech and its queue local to this display page.
    const announcements = (() => {
      const button = $('#sound');
      const pending = [];
      let models = [];
      let busy = false;
      let voices = [];
      let synth;
      let currentUtterance;
      let audio;
      let voiceRetryAt = 0;
      try {
        if (window.speechSynthesis && window.SpeechSynthesisUtterance) {
          synth = window.speechSynthesis;
          const loadVoices = () => { try { voices = synth.getVoices(); } catch {} };
          loadVoices();
          synth.onvoiceschanged = loadVoices;
        }
      } catch {}
      const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      function resume() {
        try { if (synth?.paused) synth.resume(); } catch {}
      }
      function speak(text) {
        return new Promise((resolve) => {
          if (!synth) return resolve();
          let utterance;
          let watchdog;
          let settled = false;
          const finish = () => {
            if (settled) return;
            settled = true;
            clearTimeout(watchdog);
            if (currentUtterance === utterance) currentUtterance = null;
            resolve();
          };
          try {
            voices = synth.getVoices();
            const english = voices.filter((v) => /^en(?:-|$)/i.test(v.lang));
            const voice = english.find((v) => /^en-PH$/i.test(v.lang))
              || english.find((v) => /Natural|Online|Google/i.test(v.name))
              || english.find((v) => /^en-(US|GB)$/i.test(v.lang))
              || english.find((v) => v.default);
            utterance = new window.SpeechSynthesisUtterance(text);
            if (voice) utterance.voice = voice;
            utterance.lang = voice?.lang || 'en-US';
            utterance.rate = 0.95;
            utterance.pitch = 1;
            utterance.volume = 1;
            utterance.onend = utterance.onerror = finish;
            currentUtterance = utterance;
            watchdog = setTimeout(() => {
              if (settled) return;
              try {
                if (currentUtterance === utterance) synth.cancel();
              } catch {} finally { finish(); }
            }, Math.max(6000, text.length * 150));
            resume();
            synth.speak(utterance);
          } catch { finish(); }
        });
      }
      function updateButton() { button.disabled = busy || pending.length > 0; }
      function unlockAudio() {
        try {
          // Reuse this element for real calls so its play permission comes from the click.
          audio = new Audio('data:audio/wav;base64,UklGRiUAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQEAAACA');
          void Promise.resolve(audio.play()).catch(() => {});
        } catch {}
      }
      function playAudio() {
        return new Promise((resolve, reject) => {
          let settled = false;
          let watchdog;
          const finish = (error) => {
            if (settled) return;
            settled = true;
            clearTimeout(watchdog);
            audio.onended = audio.onerror = audio.onloadedmetadata = null;
            try { audio.pause(); } catch {}
            if (error) reject(error); else resolve();
          };
          const armWatchdog = () => {
            clearTimeout(watchdog);
            const duration = Number.isFinite(audio.duration) ? audio.duration * 1000 : 0;
            watchdog = setTimeout(() => finish(new Error('Audio playback timed out')), Math.max(8000, duration + 3000));
          };
          try {
            audio.currentTime = 0;
            audio.onended = () => finish();
            audio.onerror = () => finish(new Error('Audio playback failed'));
            audio.onloadedmetadata = armWatchdog;
            armWatchdog();
            Promise.resolve(audio.play()).catch(() => finish(new Error('Audio playback failed')));
          } catch (error) { finish(error); }
        });
      }
      async function serverVoice(number) {
        if (!number || !audio || Date.now() < voiceRetryAt) return false;
        let url;
        let playedOnce = false;
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 10000); // uncached generation can take ~4-5 s
          let blob;
          try {
            // Recalls use the same number/URL: always ask the server for its current calledAt cache key.
            const response = await fetch(`/api/announce?number=${encodeURIComponent(number)}`, { signal: controller.signal, cache: 'no-store' });
            if (response.status !== 200) {
              if (response.status === 503) {
                const data = await response.json().catch(() => ({}));
                if (data.error === 'Voice not configured') voiceRetryAt = Date.now() + 5 * 60 * 1000;
              }
              return false;
            }
            blob = await response.blob();
          } finally { clearTimeout(timer); }
          url = URL.createObjectURL(blob);
          audio.src = url;
          await playAudio();
          playedOnce = true;
          document.body.dataset.voice = 'elevenlabs';
          await delay(1000);
          await playAudio();
          document.body.dataset.voice = 'elevenlabs';
          return true;
        } catch {
          return playedOnce;
        } finally {
          if (url) {
            try { audio.pause(); audio.removeAttribute('src'); audio.load(); } catch {}
            URL.revokeObjectURL(url);
          }
        }
      }
      async function drain() {
        if (busy || document.hidden) return;
        busy = true;
        try {
          updateButton();
          while (pending.length && !document.hidden) {
            const { text, number } = pending.shift();
            chime();
            await delay(900); // The existing chime's last oscillator stops at 870 ms.
            if (await serverVoice(number)) continue;
            document.body.dataset.voice = 'browser';
            await speak(text);
            if (synth) {
              await delay(1000);
              await speak(text);
            }
          }
        } finally {
          busy = false;
          updateButton();
        }
      }
      function enqueue(text, number) {
        pending.push({ text, number });
        if (pending.length > 5) pending.splice(0, pending.length - 5);
        updateButton();
        void drain();
      }
      button.onclick = () => {
        if (busy || pending.length) return;
        // Only reset an idle engine, never cancel a real call or its repetition.
        try { synth?.cancel(); } catch {}
        if (!soundOn) {
          soundOn = true;
          busy = true;
          updateButton();
          chime();
          unlockAudio();
          // speak() runs synchronously up to synth.speak(), within this gesture.
          const confirmation = speak('Call announcements are on.');
          button.textContent = 'Test announcement';
          void Promise.all([confirmation, delay(900)]).finally(() => {
            busy = false;
            updateButton();
            void drain();
          });
        } else {
          const first = models[0] || { id: 'J5', name: 'J5' };
          enqueue(callAnnouncementText({ number: `${first.id}-001`, name: 'Juan Dela Cruz', callCount: 1 }));
        }
      };
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (pending.length > 5) pending.splice(0, pending.length - 5);
        } else {
          resume();
          void drain();
        }
      });
      return {
        setModels(value) { models = value; },
        call(ticket) { if (soundOn) enqueue(callAnnouncementText(ticket), ticket.number); },
      };
    })();

    function tick() { $('#clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
    tick(); setInterval(tick, 10000);

    function render(state) {
      announcements.setModels(state.models);
      const board = $('#board');
      board.style.setProperty('--n', state.models.length);
      board.innerHTML = state.models.map((m) => {
        const mine = state.tickets.filter((t) => t.model === m.id);
        const called = mine.filter((t) => t.status === 'called').sort((a, b) => b.calledAt - a.calledAt);
        // /api/state already supplies queue order without exposing internal keys.
        const waiting = mine.filter((t) => t.status === 'waiting');
        const driving = mine.filter((t) => t.status === 'driving');
        const cur = called[0];
        return `<section class="lane">
          <div class="lane-head"><img src="${m.image}" alt="${esc(m.name)}" /><div><div class="name">${esc(m.name)}</div><div class="sub">${esc(m.tagline)}</div></div></div>
          <div class="label">Now calling</div>
          ${cur ? `<div class="now ${flashModel === m.id ? 'flash' : ''}">${cur.number}</div><div class="now-name">${esc(cur.name.split(' ')[0])}${called.length > 1 ? ` &nbsp;·&nbsp; also ${called.slice(1).map((t) => t.number).join(', ')}` : ''}</div>`
                : `<div class="idle">—</div><div class="now-name"></div>`}
          <div class="label">Up next</div>
          <div class="next">${waiting.slice(0, 5).map((t) => `<span>${t.number}</span>`).join('') || '<span class="none">No one waiting</span>'}</div>
          ${driving.length ? `<div class="driving-strip"><span class="label">On test drive</span><span class="driving">${driving.map((t) => t.number).join(' · ')}</span></div>` : ''}
          <div class="foot">${m.waitingCount} waiting · est. ${m.estWaitMin} min</div>
        </section>`;
      }).join('');
      flashModel = null;
    }

    live(render, (called) => {
      flashModel = called.model;
      announcements.call(called);
    });
  </script>
</body>
</html>
